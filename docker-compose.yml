# AI 视觉平台 Docker Compose 配置
# 包含所有服务的完整部署配置

version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: aivision-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_vision}
      MYSQL_USER: ${MYSQL_USER:-aivision}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aivision123}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+8:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aivision-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: aivision-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aivision-network

  # ZLMediaKit 流媒体服务器
  zlmediakit:
    image: zlmediakit/zlmediakit:master
    container_name: aivision-zlm
    restart: unless-stopped
    ports:
      - "1935:1935"      # RTMP
      - "554:554"        # RTSP
      - "8080:80"        # HTTP-FLV / API
      - "8443:443"       # HTTPS
      - "10000:10000/udp" # RTP
      - "30000-30100:30000-30100/udp"  # WebRTC
    volumes:
      - zlm_data:/opt/media/bin/www
      - ./docker/zlm/config.ini:/opt/media/conf/config.ini:ro
    environment:
      - TZ=Asia/Shanghai
    networks:
      - aivision-network

  # FastAPI 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aivision-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
      - backend_data:/app/data
      - ai_models:/app/models
    environment:
      - DEBUG=false
      - DATABASE_URL=mysql+aiomysql://${MYSQL_USER:-aivision}:${MYSQL_PASSWORD:-aivision123}@mysql:3306/${MYSQL_DATABASE:-ai_vision}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - ZLM_HOST=zlmediakit
      - ZLM_API_PORT=80
      - ZLM_SECRET=${ZLM_SECRET:-035c73f7-bb6b-4889-a715-d9eb2d1925cc}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aivision-network

  # 视频处理引擎 (可选，需要 GPU 支持)
  engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aivision-engine
    restart: unless-stopped
    command: ["python", "engine/main.py"]
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
      - backend_data:/app/data
      - ai_models:/app/models
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-aivision}:${MYSQL_PASSWORD:-aivision123}@mysql:3306/${MYSQL_DATABASE:-ai_vision}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      - ZLM_HOST=zlmediakit
      - ZLM_RTMP_PORT=1935
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      zlmediakit:
        condition: service_started
    # GPU 支持 (需要 nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    profiles:
      - engine  # 使用 --profile engine 启动
    networks:
      - aivision-network

  # 前端服务
  frontend:
    image: nginx:alpine
    container_name: aivision-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - aivision-network

# 数据卷
volumes:
  mysql_data:
    name: aivision-mysql-data
  redis_data:
    name: aivision-redis-data
  zlm_data:
    name: aivision-zlm-data
  backend_logs:
    name: aivision-backend-logs
  backend_data:
    name: aivision-backend-data
  ai_models:
    name: aivision-ai-models

# 网络
networks:
  aivision-network:
    name: aivision-network
    driver: bridge
