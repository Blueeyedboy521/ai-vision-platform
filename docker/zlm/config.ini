# ZLMediaKit 配置文件
# 详细配置参考: https://github.com/ZLMediaKit/ZLMediaKit/wiki

[api]
# API 密钥
secret=035c73f7-bb6b-4889-a715-d9eb2d1925cc
# 是否打印API调用日志
apiDebug=1

[ffmpeg]
# FFmpeg 路径
bin=/usr/bin/ffmpeg
# 录像文件保存路径
snap=/opt/media/bin/www/snap/
# FFmpeg 日志
log=/opt/media/log/ffmpeg.log

[general]
# 是否启用流量统计
enableVhost=0
# 单个视频片段大小(秒)
recordAppendSave=0
# 是否开启http文件服务
enableFileServer=1
# 媒体源断开后立即关闭相关连接
resetWhenRePlay=1
# 流无人观看自动关闭时间(秒)
streamNoneReaderDelayMS=20000
# 最大流无人消费时间(秒)
maxStreamWaitMS=5000
# 是否开启拉流代理录制
recordUrl=0
# 是否开启点播录像功能
recordType=0
# 合并写缓存大小
mergeWriteMS=300

[hook]
# 是否启用 Hook
enable=0
# HTTP 请求超时时间(毫秒)
timeoutSec=10
# Hook URL 前缀
admin_params=secret=035c73f7-bb6b-4889-a715-d9eb2d1925cc
# 流注册 Hook
on_stream_changed=http://backend:8000/api/v1/media/hook/stream_changed
# 播放鉴权 Hook
on_play=http://backend:8000/api/v1/media/hook/play
# 推流鉴权 Hook
on_publish=http://backend:8000/api/v1/media/hook/publish
# 录制完成 Hook
on_record_mp4=http://backend:8000/api/v1/media/hook/record

[http]
# HTTP 服务端口
port=80
sslport=443

[rtsp]
# RTSP 服务端口
port=554
sslport=332

[rtmp]
# RTMP 服务端口
port=1935

[rtp]
# RTP 服务端口
port=10000
# RTP 视频端口范围
videoMtuSize=1400
audioMtuSize=600
# RTP over TCP/UDP
rtpMaxSize=10

[rtp_proxy]
# RTP 代理端口范围
port=30000-30100

[multicast]
# 组播地址
addrMax=239.255.255.255
addrMin=239.0.0.0
udpTTL=64

[record]
# 录像保存路径
appName=record
# 单个录像文件时长(秒)
fileDuration=3600
# 录像文件路径格式
filePath=/opt/media/bin/www/record/
sampleMS=500
fastStart=0

[hls]
# HLS 配置
fileBufSize=65536
filePath=/opt/media/bin/www/hls/
segDur=2
segNum=3
segRetain=5
broadcastRecordTs=0
